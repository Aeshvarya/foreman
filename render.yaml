# Foreman on Render — one Docker service, one public URL.
#
# Neo4j is intentionally NOT required here. With no NEO4J_URI the app runs on
# the JSON mirror in src/db.py (parity-tested against Neo4j in tests/), so the
# link a judge clicks is live whether or not a graph database is reachable.
# To upgrade to real Cypher, add the three NEO4J_* vars in the dashboard.
#
# `plan` is deliberately omitted: Render's blueprint validator rejects
# `plan: free` for web services ("no such plan free"). Leaving it out takes
# the account default, and the instance type is selectable in the dashboard.
services:
  - type: web
    name: foreman
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Set in the dashboard, never committed.
      - key: GEMINI_API_KEY
        sync: false
